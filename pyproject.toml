[project]
name = "funding-workflow-automation"
version = "0.1.0"
description = "Automatisation du traitement des demandes de financement (MVP)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "psycopg2-binary>=2.9,<3",
    "alembic>=1.13,<2",
    "pgvector>=0.3,<1",
    "celery[redis]>=5.4,<6",
    "redis>=5.0,<6",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Le paquet partagé est importé sous le nom `core` (packages/core).
pythonpath = ["packages"]
addopts = "-q"
